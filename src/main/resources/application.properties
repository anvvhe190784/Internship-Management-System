spring.application.name=Internship-Management-System

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/internship_management_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3f5a6c8e0b2d4f6a8c0e2f4a6b8c0d2e4f6a8c0b2d4f6a8c0e2f
app.jwt.expiration-ms=86400000

# Server Port
server.port=8080
