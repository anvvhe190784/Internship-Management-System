spring.application.name=Internship-Management-System
# Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true
# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/internship_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3f5a6c8e0b2d4f6a8c0e2f4a6b8c0d2e4f6a8c0b2d4f6a8c0e2f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Server Port
server.port=${PORT:8080}
